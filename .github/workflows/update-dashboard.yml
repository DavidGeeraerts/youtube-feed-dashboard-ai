name: Update dashboard

# GitHub schedules are UTC and can start later than the clock time.
# 03:30, 15:30, 19:30, and 23:30 UTC land in the Pacific morning, midday,
# afternoon, and evening (about 7:30am, 11:30am, 3:30pm, and 7:30pm PST,
# or one hour later during PDT).
on:
  schedule:
    - cron: "30 3,15,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Queue overlapping runs so two jobs cannot push feed data at the same time.
concurrency:
  group: youtube-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test feed parser
        run: |
          python -m unittest discover -s tests -v
          bash tests/test_publish_feed_data.sh

      - name: Use the latest branch tip
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Fetch YouTube feeds
        run: python scripts/fetch_feeds.py

      - name: Commit feed data
        id: feed
        run: bash scripts/publish_feed_data.sh "${GITHUB_REF_NAME}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          build_revision: ${{ steps.feed.outputs.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
