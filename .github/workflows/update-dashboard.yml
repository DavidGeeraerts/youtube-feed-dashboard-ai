name: Update dashboard

# GitHub schedules are UTC and can start later than the clock time.
# 03:30, 15:30, 19:30, and 23:30 UTC land in the Pacific morning, midday,
# afternoon, and evening (about 7:30am, 11:30am, 3:30pm, and 7:30pm PST,
# or one hour later during PDT).
on:
  schedule:
    - cron: "30 3,15,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: youtube-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test feed parser
        run: python -m unittest discover -s tests -v

      - name: Fetch YouTube feeds
        run: python scripts/fetch_feeds.py

      - name: Commit feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update YouTube feed data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
